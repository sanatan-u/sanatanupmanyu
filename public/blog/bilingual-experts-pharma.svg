  </defs>
  <rect width="1200" height="630" fill="url(#be-bg)"/>

  <text x="600" y="100" text-anchor="middle" font-family="Georgia, serif" font-size="36" fill="#1c3b39" font-weight="600">bilingual expertise</text>
  <text x="600" y="135" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#1c3b39" font-style="italic" opacity="0.75">where domain fluency meets data science</text>

  <g stroke="#2f5d5a" stroke-width="2" fill="none">
