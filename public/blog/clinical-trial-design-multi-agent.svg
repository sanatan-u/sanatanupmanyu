<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Multi-agent pipeline for clinical trial design showing specialized agents flowing from drug intelligence to protocol output">
  <defs>
    <linearGradient id="bg4" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#f7f6f3"/>
      <stop offset="1" stop-color="#e6e9ec"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg4)"/>

  <g stroke="#2f5d5a" stroke-width="1.75" fill="none">
    <path d="M 195 240 L 285 240"/>
    <path d="M 435 240 L 525 240"/>
    <path d="M 675 240 L 765 240"/>
    <path d="M 915 240 L 1005 240"/>
    <path d="M 600 290 L 600 360"/>
    <path d="M 600 460 L 600 510"/>
  </g>

  <g fill="#ffffff" stroke="#2f5d5a" stroke-width="2">
    <rect x="60" y="200" width="135" height="80" rx="8"/>
    <rect x="285" y="200" width="150" height="80" rx="8"/>
    <rect x="525" y="200" width="150" height="80" rx="8"/>
    <rect x="765" y="200" width="150" height="80" rx="8"/>
    <rect x="1005" y="200" width="135" height="80" rx="8"/>
  </g>

  <g fill="#ffffff" stroke="#a13d1e" stroke-width="2">
    <rect x="495" y="360" width="210" height="80" rx="8"/>
    <rect x="495" y="510" width="210" height="80" rx="8"/>
  </g>

  <g font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1c3b39" text-anchor="middle">
    <text x="127" y="236">Drug</text>
    <text x="127" y="254">Intelligence</text>
    <text x="360" y="236">Disease</text>
    <text x="360" y="254">Landscape</text>
    <text x="600" y="236">Analogous</text>
    <text x="600" y="254">Trials</text>
    <text x="840" y="236">Protocol</text>
    <text x="840" y="254">Design</text>
    <text x="1072" y="236">Endpoints</text>
    <text x="1072" y="254">&amp; Criteria</text>
  </g>

  <g font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#a13d1e" text-anchor="middle">
    <text x="600" y="396">Biostatistics</text>
    <text x="600" y="414">Agent</text>
    <text x="600" y="546">Statistical</text>
    <text x="600" y="564">Engine</text>
  </g>

  <g fill="#a13d1e">
    <circle cx="600" cy="325" r="6"/>
    <circle cx="600" cy="490" r="6"/>
  </g>

  <g font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#7a7a7a" text-anchor="middle">
    <text x="635" y="322">reasons</text>
    <text x="635" y="488">computes</text>
  </g>

  <text x="60" y="600" font-family="Georgia, serif" font-style="italic" font-size="24" fill="#1c3b39">agents that mirror a clinical development team</text>
</svg>
